[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beg"
version = "0.1.0"
description = "Building Energy Graphs: graph representation designs for GNN-based building energy prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agata Dalach", email = "agata.dalach@tum.de" }]
keywords = ["building energy", "graph neural networks", "EnergyPlus", "epJSON", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# Core: ingestion, SQL transforms and graph DataFrames, without torch.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "networkx>=3.2,<4",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "scipy>=1.11",
    # Surface shading metrics, a transform every configuration uses.
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
    "honeybee-core>=1.64,<2",
    "ladybug-core>=0.44,<1",
    "ladybug-geometry>=1.34,<2",
]
notebooks = [
    "ipython>=8.18",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    # Re-runs a notebook in place:
    #   jupyter nbconvert --to notebook --execute --inplace notebooks/BEG_01_Ingest.ipynb
    "nbconvert>=7.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]
all = ["beg[train,viz,notebooks,dev]"]

[project.scripts]
beg = "beg.cli:main"

[project.urls]
Repository = "https://github.com/adalach/BuildingEnergyGraphs"

[tool.setuptools.packages.find]
include = ["beg*"]

[tool.setuptools.package-data]
beg = ["sql/**/*.sql", "sql/**/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Hashed into the implementation fingerprint of the published runs: any edit to
# these files, formatting included, gives every run a new fingerprint.
extend-exclude = ["beg/models/gnn.py", "beg/train/search.py", "beg/train/runner.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# The first cell checks the environment before importing what it checks for.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a reachable PostgreSQL server (BEG_DSN)",
    "torch: requires torch and torch-geometric",
    "slow: long-running",
]
